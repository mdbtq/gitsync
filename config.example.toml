# gitsync configuration
# Copy to ~/.config/gitsync/config.toml and adjust.

# Seconds between passes when running as a background agent.
# Baked into the launchd plist at install time: re-run `gitsync install` after
# changing this. (Repo entries below are re-read every pass, so they need no
# reinstall.)
interval = 300

# Optional: where to write logs (default: ~/.local/state/gitsync/gitsync.log)
# Also baked into the plist; re-run `gitsync install` after changing it.
# log_file = "~/.local/state/gitsync/gitsync.log"

# One [[repo]] block per directory. Each must already be a git working tree
# with a remote configured (e.g. `git clone` or `git remote add origin ...`).

[[repo]]
path = "~/.dotfiles"
# remote = "origin"      # default
# conflict = "manual"    # manual | ours | theirs (default: manual)

[[repo]]
path = "~/Notes"
conflict = "theirs"       # on a clash, prefer whatever came from the remote

[[repo]]
path = "~/work"
# Only sync these branches; any other checked-out branch is skipped entirely.
# Exact names or globs. Omit the key to sync whatever branch is checked out.
branches = ["main", "release/*"]
